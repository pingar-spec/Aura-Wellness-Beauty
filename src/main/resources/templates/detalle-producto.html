<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle y Pedido - Aura Wellness & Beauty</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="logo-area"><div class="logo-badge">AW</div><a th:href="@{/}" class="logo-text">Aura Wellness & Beauty</a></div>
        <nav><a th:href="@{/}">INICIO</a><a th:href="@{/bienestar}">LÍNEA BIENESTAR</a><a th:href="@{/estetica}">SERVICIOS ESTÉTICA</a></nav>
    </header>
    <div class="main-container" style="margin-top: 40px; max-width: 700px;">
        <div class="section-box" style="text-align: left;">
            <h2 class="section-heading" style="text-align: left;">🛒 Confirmar Pedido o Cita</h2>
            <h3 style="color: var(--primary-main); font-size: 22px; margin-bottom: 5px;" th:text="${nombreProducto}">Producto</h3>
            <div style="font-size: 20px; font-weight: bold; color: var(--accent-gold); margin-bottom: 20px;" th:text="${precioProducto}">S/ 0.00</div>
            
            <form onsubmit="alert('¡Solicitud registrada con éxito! Nos pondremos en contacto para tu servicio en El Agustino.'); window.location.href='/'; return false;">
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px;">Nombre Completo:</label>
                    <input type="text" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px;" placeholder="Ej. Piero Inga">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px;">Dirección en El Agustino / Lima Este:</label>
                    <input type="text" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px;" placeholder="Ej. Av. Riva Agüero">
                </div>
                <div style="margin-bottom: 20px;">
                    <label style="font-size: 13px; font-weight: 600; display: block; margin-bottom: 5px;">Teléfono:</label>
                    <input type="tel" required style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px;" placeholder="Ej. 987654321">
                </div>
                <button type="submit" class="btn-booking" style="width: 100%; border: none; cursor: pointer; padding: 12px; font-size: 14px;">Confirmar Solicitud</button>
            </form>
            <div style="margin-top: 20px; text-align: center;"><a th:href="@{/}" style="color: var(--primary-main); font-weight: 600; text-decoration: none;">← Volver al Inicio</a></div>
        </div>
    </div>
    <footer><div>POLÍTICA DE PRIVACIDAD</div><div>🛡️ SECURE</div></footer>
</body>
</html>
